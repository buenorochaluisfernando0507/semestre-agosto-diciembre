<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SHEIN x DIOR - Formulario de Compra</title>
</head>
<body>

    <h1>SHEIN | DIOR</h1>
    <h2>Formulario de Compra</h2>

    <form action="guardar.php" method="POST">

        <label>Producto a comprar:</label><br>
        <input type="text" id="producto" name="producto" readonly><br><br>

        <label>Nombre Completo:</label><br>
        <input type="text" name="nombre" required><br><br>

        <label>Correo Electrónico:</label><br>
        <input type="email" name="correo" required><br><br>

        <label>Dirección:</label><br>
        <input type="text" name="direccion" required><br><br>

        <label>Método de Pago:</label><br>
        <select name="metodo">
            <option value="Tarjeta">Tarjeta</option>
            <option value="Efectivo en OXXO">Efectivo en OXXO</option>
            <option value="PayPal">PayPal</option>
        </select><br><br>

        <button type="submit">Pagar Ahora</button>

    </form>

    <!-- Codigo básico para poner el nombre del perfume en la caja de texto -->
    <script>
        var datos = new URLSearchParams(window.location.search);
        var perfume = datos.get('producto');
        document.getElementById('producto').value = perfume;
    </script>

</body>
</html>
