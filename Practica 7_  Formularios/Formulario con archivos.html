<!DOCTYPE html><!-- indica la versión de HTML -->
<html lang="en"><!-- idioma principal de la página -->
<head><!-- información interna de la página -->
<meta charset="UTF-8"><!-- codificación de caracteres -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- diseño adaptable a pantallas -->
<title>Formularios en HTML</title><!-- título de la pestaña del navegador -->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><!-- hoja de estilos para íconos -->

</head><!-- cierre del head -->
<body><!-- cuerpo visible de la página -->
	<h2>Formulario con archivos</h2><!-- título de la sección -->
<form action="" method="post"><!-- contenedor del formulario -->

Ingresa tu nombre:
<input type="text" name="nombre"><!-- campo para texto libre -->
<br><!-- salto de línea -->
<input type="file" name="archivo"><!-- campo para subir archivos -->
<br><!-- salto de línea -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button><!-- botón para enviar datos -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button><!-- botón para limpiar formulario -->
</form><!-- cierre del formulario -->
</body><!-- cierre del cuerpo -->
</html><!-- cierre del documento html -->
