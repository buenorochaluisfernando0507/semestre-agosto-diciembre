<!DOCTYPE html><!-- sirve para indicarle al navegador qué versión de HTML se está utilizando -->
<html lang="en"><!-- sirve para indicar que el idioma principal de una página web es el inglés -->
<head><!-- muestra información interna -->
<meta charset="UTF-8"><!-- sirve para indicar al navegador qué codificación de caracteres debe usar -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- le avisa al navegador cómo debe mostrar una página en móviles -->
<title>Formularios en HTML</title><!-- para definir el título oficial de una página web -->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><!-- hoja de estilos para íconos externos -->

</head><!-- cierre -->
<body><!-- cuerpo de la página -->
	<h2>Formularios con seleccion</h2><!-- título secundario de la sección -->
<form action="" method="post"><!-- contenedor principal del formulario -->
Ingresa tu nombre:
<input type="text" name="nombre"><!-- campo de entrada para ingresar texto -->

<br><!-- salto de línea -->
Selecciona tu pais:
<select name="pais"><!-- lista desplegable para selección de opciones -->
<option value="1">Argentina</option><!-- opción desplegable para Argentina -->
<option value="2">España</option><!-- opción desplegable para España -->
<option value="3">Mexico</option><!-- opción desplegable para México -->
<option value="4">Guatemala</option><!-- opción desplegable para Guatemala -->
<option value="5">Honduras</option><!-- opción desplegable para Honduras -->
<option value="6">El Salvador</option><!-- opción desplegable para El Salvador -->
<option value="7">Venezuela</option><!-- opción desplegable para Venezuela -->
<option value="8">Colombia</option><!-- opción desplegable para Colombia -->
</select><!-- cierre del menú desplegable -->
<br><!-- salto de línea -->
<input type="submit" value="enviar"><!-- botón para enviar los datos del formulario -->
<input type="reset" value="borrar"><!-- botón para reiniciar o borrar los campos -->
</form><!-- cierre del formulario -->
</body><!-- cierre del cuerpo -->
</html><!-- cierre del documento html -->
